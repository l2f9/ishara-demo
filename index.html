<!doctype html>
<html lang="en" dir="ltr">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ishara turns sign language into text and natural speech, in Arabic and English." />
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      // Light unless the person chose dark. Set before the first paint so the page never flashes the wrong theme.
      (function () {
        var t = 'light';
        try { if (JSON.parse(localStorage.getItem('ishara.settings.v1') || '{}').theme === 'dark') t = 'dark'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#000000' : '#f5f5f7');
      })();
    </script>
